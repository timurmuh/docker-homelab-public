services:
  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data2:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    # Tag-floating on purpose: watchtower owns this service's upgrades, via the
    # "com.centurylinklabs.watchtower.enable" label below. Pinning is the repo's
    # forward rule for new stacks, not a rule the older ones keep; `searxng` is
    # the one documented exception because it has an update manager of its own.
    # See `crw/README.md`.
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:r
      - searxng-data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://searxng.homelab.example.com/
      # Set a random value (e.g. `openssl rand -hex 32`) in .env or the
      # environment; do not commit it.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET}
    networks:
      - traefik_net
      # Second network, shared with the crw stack: crw reaches this service as
      # `http://searxng:8080`. traefik_net remains the public edge; crw is not
      # on it, so the only link between the two worlds is this container.
      # `deploy.sh` creates `search_net`; both this file and crw's declare it
      # external, so neither stack can bring it into being on its own.
      - search_net
    labels:
      traefik.enable: "true"
      traefik.http.routers.searxng.rule: "Host(`searxng.homelab.example.com`)"
      traefik.http.routers.searxng.entrypoints: "websecure"
      traefik.http.routers.searxng.tls.certresolver: "cloudflare"
      traefik.http.services.searxng.loadbalancer.server.port: "8080"
      "com.centurylinklabs.watchtower.enable": "true"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  traefik_net:
    name: traefik_net
    external: true
  # Created by deploy.sh, not by this or the crw stack: both declare it
  # external. crw, lightpanda and chrome join it from crw/docker-compose.yml.
  search_net:
    name: search_net
    external: true

volumes:
  valkey-data2:
  searxng-data:
      