use_default_settings: true

search:
  formats:
    - html
    - json

# Direct-IP mode (rota proxy rotator tabled): still no proxy block, and TLS
# verify stays at its default (true). The caps below are the one deliberate
# departure from "defaults everywhere": this build leaves
# `max_request_timeout` None, so a search's deadline is just the slowest
# *selected* engine's own `timeout`, and any fan-out that picks a slow one waits
# it out in full.
#
# Which engine that is belongs to the image, not to this file: searxng
# tag-floats and watchtower upgrades it, so the set of engines above this cap can
# change without a commit here. Re-read it after every image pull instead of
# trusting a number written in a comment:
#
#   docker exec searxng /usr/local/searxng/.venv/bin/python -c \
#     'from searx import settings; d={e["name"]: e.get("timeout") for e in settings["engines"] if (e.get("timeout") or 0) > 4}; print(len(d), "engines above 4s:", sorted(d.items(), key=lambda kv: -kv[1])[:8])'
#
# When this was written: 43 engines had a timeout above 4 s, and the slowest one
# a default search actually selected burned 20.0 s (see the measured table in
# crw/README.md). The caps do not depend on that number — 4.0 bounds the whole
# search whichever engine is slowest — so a re-read only tells you how much the
# cap is currently trimming.
outgoing:
  request_timeout: 3.0
  max_request_timeout: 4.0

# Force-enable ALL engines (including the ones default-disabled: key-gated and
# unreliable). Engines needing API keys simply error and get auto-suspended by
# SearXNG; results come from the ones that work.
