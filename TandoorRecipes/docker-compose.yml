services:
  db_recipes:
    restart: always
    image: postgres:16-alpine
    networks:
    - default
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    env_file:
      - ./.env

  web_recipes:
    restart: always
    image: vabene1111/recipes
    networks:
    - default
    env_file:
      - ./.env
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      # Do not make this a bind mount, see https://docs.tandoor.dev/install/docker/#volumes-vs-bind-mounts
      - nginx_config:/opt/recipes/nginx/conf.d
      - ./mediafiles:/opt/recipes/mediafiles
    depends_on:
      - db_recipes

  nginx_recipes:
    image: nginx:mainline-alpine
    restart: always
    # ports:
      # - 10690:80
    networks:
      - default
      - traefik_net
    env_file:
      - ./.env
    depends_on:
      - web_recipes
    volumes:
      # Do not make this a bind mount, see https://docs.tandoor.dev/install/docker/#volumes-vs-bind-mounts
      - nginx_config:/etc/nginx/conf.d:ro
      - staticfiles:/static:ro
      - ./mediafiles:/media:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.tandoor.rule: "Host(`tandoor.homelab.example.com`)"
      traefik.http.routers.tandoor.entrypoints: "websecure"
      traefik.http.routers.tandoor.tls.certresolver: "cloudflare"
      traefik.http.services.tandoor.loadbalancer.server.port: "80"

volumes:
  nginx_config:
  staticfiles:

networks:
  default:
  traefik_net:
    name: traefik_net
    external: true
