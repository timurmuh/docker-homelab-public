server {
    listen 80;

    location /api/ {
        proxy_pass http://rota-core:8001;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://rota-core:8001;
    }

    location /metrics {
        proxy_pass http://rota-core:8001;
    }

    location /ws/ {
        proxy_pass http://rota-core:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://rota-dashboard:3000;
        proxy_set_header Host $host;
    }
}
